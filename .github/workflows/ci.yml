name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      GC_SCHEMA_TEST_DSN: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: make check
      - run: make test
      - run: make secret-scan
      - name: schema apply (migrations)
        run: |
          createdb -h localhost -U postgres gc_ci
          DATABASE_URL=postgresql://postgres:ci@localhost:5432/gc_ci make migrate
        env:
          PGPASSWORD: ci
